name: DraftGuru data acquisition

on:
  pull_request:
    branches: [vnext]
    paths:
      - "scripts/scrape_draftguru_lists.py"
      - "scripts/match_draftguru_lists.py"
      - "scripts/finalize_draftguru_eligibility.py"
      - "data/historical/draftguru_manual_decisions_2018_2024.csv"
      - ".github/workflows/draftguru-data-acquisition.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper and matcher dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          requests beautifulsoup4 rapidfuzz python-dateutil

      - name: Scrape DraftGuru annual lists
        run: >-
          python scripts/scrape_draftguru_lists.py
          --years 2018-2024
          --out build/draftguru
          --delay 0.50

      - name: Match DraftGuru people to repository keys
        run: >-
          python scripts/match_draftguru_lists.py
          --draftguru build/draftguru/draftguru_eligibility_2018_2024.csv
          --database engine/rl_after/rl_model_data.json
          --out build/draftguru

      - name: Apply reviewed decisions and build full eligibility matrix
        run: >-
          python scripts/finalize_draftguru_eligibility.py
          --eligibility build/draftguru/draftguru_eligibility_2018_2024.csv
          --mapping build/draftguru/draftguru_player_key_map.csv
          --manual-decisions data/historical/draftguru_manual_decisions_2018_2024.csv
          --database engine/rl_after/rl_model_data.json
          --out build/draftguru

      - name: Validate expected outputs
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          root = Path("build/draftguru")
          manifest = json.loads((root / "manifest.json").read_text())
          match_summary = json.loads((root / "match_summary.json").read_text())
          final = json.loads((root / "finalization_summary.json").read_text())
          assert manifest["years"] == list(range(2018, 2025)), manifest
          assert manifest["club_pages"] == 126, manifest
          assert manifest["player_season_rows"] == 5698, manifest
          assert match_summary["draftguru_unique_people"] == 1465, match_summary
          assert final["matched_draftguru_people"] == 1440, final
          assert final["excluded_draftguru_people"] == 25, final
          assert final["manual_matches"] == 79, final
          assert final["manual_exclusions"] == 25, final
          assert final["matrix_rows"] == final["database_unique_keys"] * 7, final
          with (root / "historical_eligibility_2018_2024.csv").open(newline="", encoding="utf-8") as fh:
              rows = list(csv.DictReader(fh))
          assert len(rows) == final["matrix_rows"]
          assert len({(row["player_key"], row["origin_year"]) for row in rows}) == len(rows)
          print(json.dumps(manifest, indent=2, sort_keys=True))
          print(json.dumps(match_summary, indent=2, sort_keys=True))
          print(json.dumps(final, indent=2, sort_keys=True))
          PY

      - name: Upload extracted data, final evidence and source cache
        uses: actions/upload-artifact@v4
        with:
          name: draftguru-lists-2018-2024
          path: build/draftguru
          if-no-files-found: error
          retention-days: 14
