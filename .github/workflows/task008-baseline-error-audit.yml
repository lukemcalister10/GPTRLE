name: TASK-008 baseline-error audit

on:
  pull_request:
    branches: [vnext]
    paths:
      - '.github/workflows/task008-baseline-error-audit.yml'
      - 'vnext/audit_task008_baseline_errors.py'
      - 'vnext/tests/test_task008_baseline_errors.py'
      - 'docs/tasks/TASK-008-BASELINE-ERROR-AUDIT.md'
      - 'docs/current/TASK-008-BASELINE-ERROR-AUDIT.md'
      - 'reports/task-008-baseline-error-audit/**'
      - 'docs/current/ACTIVE_TASK'
      - 'docs/current/DECISION_LOG.md'
      - 'docs/current/HANDOVER.md'
      - 'scripts/generate_handover.py'
  workflow_dispatch:

jobs:
  audit-unchanged-claude:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-vnext.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-vnext.txt
          python -m pip install Unidecode
      - name: Verify frozen Claude files
        run: python scripts/verify_legacy_manifest.py
      - name: Recreate legacy runtime paths
        run: |
          sudo mkdir -p /home/claude/rl_build /home/claude/rl_workspace
          sudo ln -sfn "$GITHUB_WORKSPACE/engine/rl_after" /home/claude/rl_after
          sudo ln -sfn "$GITHUB_WORKSPACE/engine/forward_valuation" /home/claude/rl_workspace/forward_valuation
          echo '{"active":[]}' | sudo tee /home/claude/rl_build/rl_app_data.json >/dev/null
      - name: Generate unchanged Claude board
        working-directory: engine/rl_after
        run: |
          export RL_FV="$GITHUB_WORKSPACE/engine/forward_valuation"
          export PYTHONPATH="$GITHUB_WORKSPACE/engine/forward_valuation:$GITHUB_WORKSPACE/engine/rl_after"
          python rl_export.py
      - name: Build authoritative registry
        run: PYTHONPATH=vnext python vnext/active_universe.py --out build/task008-registry
      - name: Audit baseline defects
        run: |
          python vnext/audit_task008_baseline_errors.py \
            --claude-board engine/rl_after/rl_app_data.json \
            --registry build/task008-registry/authoritative_universe.csv \
            --out build/task008
      - name: Prove TASK-006 is not an audit dependency
        run: |
          test "$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('build/task008/summary.json').read_text())
          assert data['players'] == 804
          assert data['raw_active_players'] == 805
          assert data['legacy_only_keys'] == ['taylor-adams']
          print(data['value_field'])
          PY
          )" = "v"
          test ! -e build/task006
      - name: Run vNext tests
        run: cd vnext && python -m pytest -q
      - name: Check generated handover
        run: python scripts/generate_handover.py --check
      - name: Package evidence
        run: |
          cd build
          zip -r task008-baseline-error-audit.zip task008
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: task008-baseline-error-audit
          path: |
            build/task008
            build/task008-baseline-error-audit.zip
          if-no-files-found: error
