name: TASK-009 zero-history state separation

on:
  pull_request:
    branches: [vnext]
    paths:
      - '.github/workflows/task009-zero-history.yml'
      - 'vnext/model_artifacts_zero_history.py'
      - 'vnext/run_task003q_folds.py'
      - 'vnext/run_task009_zero_history_folds.py'
      - 'vnext/compare_task009_zero_history.py'
      - 'vnext/tests/test_task009_zero_history.py'
      - 'docs/tasks/TASK-009-ZERO-HISTORY-STATE-SEPARATION.md'
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-vnext.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-vnext.txt
          python -m pip install Unidecode
      - name: Verify frozen Claude files
        run: python scripts/verify_legacy_manifest.py
      - name: Build locked cohorts
        run: PYTHONPATH=vnext python vnext/build_historical_cohorts.py --out build/task009/cohorts
      - name: Generate accepted TASK-003Q baseline folds
        run: PYTHONPATH=vnext python vnext/run_task003q_folds.py --cohort-dir build/task009/cohorts --out build/task009/baseline --rebuild
      - name: Generate TASK-009 candidate folds
        run: PYTHONPATH=vnext python vnext/run_task009_zero_history_folds.py --cohort-dir build/task009/cohorts --out build/task009/candidate --rebuild
      - name: Compare candidate with TASK-003Q
        run: |
          PYTHONPATH=vnext python vnext/compare_task009_zero_history.py \
            --baseline build/task009/baseline/vnext_predictions.csv \
            --candidate build/task009/candidate/vnext_predictions.csv \
            --targets build/task009/cohorts/targets.csv \
            --snapshots build/task009/cohorts/included_snapshots.csv \
            --out build/task009/results
      - name: Run vNext tests
        run: cd vnext && python -m pytest -q
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task009-zero-history
          path: |
            build/task009/results
            build/task009/baseline/prediction_manifest.json
            build/task009/candidate/prediction_manifest.json
          if-no-files-found: error
