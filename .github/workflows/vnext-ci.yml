name: vNext CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, vnext]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-vnext.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements-vnext.txt

      - name: Verify frozen legacy files
        run: python scripts/verify_legacy_manifest.py

      - name: Run vNext tests
        run: cd vnext && python -m pytest -q

      - name: Check generated handover
        run: python scripts/generate_handover.py --check
