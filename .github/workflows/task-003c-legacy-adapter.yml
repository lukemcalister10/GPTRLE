name: TASK-003C legacy diagnostic

on:
  pull_request:
    paths:
      - "vnext/**"
      - "engine/rl_after/**"
      - "artifacts/legacy_manifest.json"
      - "scripts/verify_legacy_manifest.py"
      - ".github/workflows/task-003c-legacy-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install vNext requirements
        run: python -m pip install -r requirements-vnext.txt

      - name: Verify frozen legacy manifest
        run: python scripts/verify_legacy_manifest.py

      - name: Build locked cohorts
        run: python vnext/build_historical_cohorts.py --out build/task-003c-cohorts

      - name: Run diagnostic proxy twice
        run: |
          python vnext/legacy_historical_adapter.py \
            --cohort-dir build/task-003c-cohorts \
            --out build/task-003c-diagnostic-first \
            --no-rebuild-cohorts
          python vnext/legacy_historical_adapter.py \
            --cohort-dir build/task-003c-cohorts \
            --out build/task-003c-diagnostic-second \
            --no-rebuild-cohorts

      - name: Verify deterministic blocked disposition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          first_dir = Path("build/task-003c-diagnostic-first")
          second_dir = Path("build/task-003c-diagnostic-second")
          first = json.loads((first_dir / "legacy_diagnostic_manifest.json").read_text())
          second = json.loads((second_dir / "legacy_diagnostic_manifest.json").read_text())

          assert first["formal_benchmark_eligible"] is False
          assert first["formal_legacy_prediction_artifact_created"] is False
          assert first["diagnostic_model_id"] == "legacy_diagnostic_proxy"
          assert first["reserved_formal_model_id"] == "legacy_frozen"
          assert len(first["blockers"]) == 3
          assert first["lead_invariant_player_origins"] == 5622
          assert first["diagnostic_prediction_hash"] == second["diagnostic_prediction_hash"]
          assert first["artifacts"] == second["artifacts"]
          assert not (first_dir / "legacy_predictions.csv").exists()
          assert (first_dir / "legacy_diagnostic_predictions.csv").exists()
          PY

      - name: Upload diagnostic and blocker artifacts
        uses: actions/upload-artifact@v4
        with:
          name: task-003c-legacy-diagnostic
          path: |
            build/task-003c-cohorts
            build/task-003c-diagnostic-first
            build/task-003c-diagnostic-second
          if-no-files-found: error
          retention-days: 90
