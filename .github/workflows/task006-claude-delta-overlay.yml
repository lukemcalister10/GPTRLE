name: TASK-006 Claude delta overlay

on:
  pull_request:
    branches: [vnext]
    paths:
      - '.github/workflows/task006-claude-delta-overlay.yml'
      - 'vnext/task006_claude_delta_overlay.py'
  workflow_dispatch:

jobs:
  evaluate-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-vnext.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-vnext.txt
          python -m pip install Unidecode
      - name: Verify frozen legacy files
        run: python scripts/verify_legacy_manifest.py
      - name: Recreate legacy runtime paths
        run: |
          sudo mkdir -p /home/claude/rl_build /home/claude/rl_workspace
          sudo ln -sfn "$GITHUB_WORKSPACE/engine/rl_after" /home/claude/rl_after
          sudo ln -sfn "$GITHUB_WORKSPACE/engine/forward_valuation" /home/claude/rl_workspace/forward_valuation
          echo '{"active":[]}' | sudo tee /home/claude/rl_build/rl_app_data.json >/dev/null
      - name: Generate unchanged Claude board
        working-directory: engine/rl_after
        run: |
          export RL_FV="$GITHUB_WORKSPACE/engine/forward_valuation"
          export PYTHONPATH="$GITHUB_WORKSPACE/engine/forward_valuation:$GITHUB_WORKSPACE/engine/rl_after"
          python rl_export.py
      - name: Build forecasts and TASK-004 board
        run: |
          PYTHONPATH=vnext python vnext/active_universe.py --out build/task006/registry
          python vnext/build_annual_dataset.py --data engine/rl_after/rl_model_data.json --out build/task006/annual_rows.csv --min-origin 2008 --max-origin 2026
          PYTHONPATH=vnext python vnext/train_model_artifacts.py --dataset build/task006/annual_rows.csv --out build/task006/current --module model_artifacts --target-cutoff 2025
          PYTHONPATH=vnext python vnext/train_model_artifacts.py --dataset build/task006/annual_rows.csv --out build/task006/task003q --module model_artifacts_task003q --target-cutoff 2025
          PYTHONPATH=vnext python vnext/review_task003n_current_board.py --current-artifacts build/task006/current --candidate-artifacts build/task006/task003q --current-module model_artifacts --candidate-module model_artifacts_task003q --out build/task006/forecast-review
          PYTHONPATH=vnext python vnext/task004_claude_adapter.py --claude-board engine/rl_after/rl_app_data.json --registry build/task006/registry/authoritative_universe.csv --current-forecast build/task006/forecast-review/current_board_annual.csv --task003q-forecast build/task006/forecast-review/candidate_board_annual.csv --out build/task006/task004
      - name: Apply TASK-006 overlay
        run: PYTHONPATH=vnext python vnext/task006_claude_delta_overlay.py --task004-board build/task006/task004/unblinded_three_board_comparison.csv --out build/task006/results
      - name: Run vNext tests
        if: always()
        run: cd vnext && python -m pytest -q
      - name: Package evidence
        if: always()
        run: cd build/task006 && zip -r task006-claude-delta-overlay.zip results
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task006-claude-delta-overlay
          path: |
            build/task006/results
            build/task006/task006-claude-delta-overlay.zip
          if-no-files-found: warn
