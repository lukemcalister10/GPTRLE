name: TASK-003P exact-age crossover

on:
  pull_request:
    branches:
      - agent/task003k-event-logistic
    paths:
      - ".github/workflows/task003p-age-crossover.yml"
      - "vnext/analyse_task003p_age_crossover.py"
      - "vnext/run_task003k_folds.py"
      - "vnext/run_historical_folds.py"
  workflow_dispatch:

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out candidate stack
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Check out unchanged vNext
        uses: actions/checkout@v4
        with:
          ref: vnext
          path: current-vnext
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: candidate/requirements-vnext.txt
      - name: Install dependencies
        run: python -m pip install -r candidate/requirements-vnext.txt
      - name: Build locked cohorts
        working-directory: candidate
        run: python vnext/build_historical_cohorts.py --out ../analysis/cohorts
      - name: Generate current predictions
        working-directory: current-vnext
        run: python vnext/run_historical_folds.py --cohort-dir ../analysis/cohorts --out ../analysis/current --rebuild
      - name: Generate TASK-003K predictions
        working-directory: candidate
        run: python vnext/run_task003k_folds.py --cohort-dir ../analysis/cohorts --out ../analysis/candidate --rebuild
      - name: Analyse exact-age crossover and exploratory blends
        working-directory: candidate
        run: >-
          python vnext/analyse_task003p_age_crossover.py
          --current ../analysis/current/vnext_predictions.csv
          --candidate ../analysis/candidate/vnext_predictions.csv
          --targets ../analysis/cohorts/targets.csv
          --snapshots ../analysis/cohorts/included_snapshots.csv
          --out ../analysis/task003p
          --min-n 80
      - name: Run vNext tests
        working-directory: candidate/vnext
        run: pytest -q
      - name: Upload TASK-003P outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-003p-age-crossover
          path: analysis/task003p/
          if-no-files-found: error
