name: TASK-013 forward-zero continuity

on:
  pull_request:
    branches: [vnext]
    paths:
      - '.github/workflows/task013-forward-zero-continuity.yml'
      - 'vnext/forward_value_continuity.py'
      - 'vnext/tests/test_forward_value_continuity.py'
      - 'docs/tasks/TASK-013-FORWARD-ZERO-CONTINUITY.md'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-vnext.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-vnext.txt
          python -m pip install Unidecode
      - name: Verify frozen Claude files
        run: python scripts/verify_legacy_manifest.py
      - name: Recreate legacy runtime paths
        run: |
          sudo mkdir -p /home/claude/rl_build /home/claude/rl_workspace
          sudo ln -sfn "$GITHUB_WORKSPACE/engine/rl_after" /home/claude/rl_after
          sudo ln -sfn "$GITHUB_WORKSPACE/engine/forward_valuation" /home/claude/rl_workspace/forward_valuation
          echo '{"active":[]}' | sudo tee /home/claude/rl_build/rl_app_data.json >/dev/null
      - name: Generate unchanged Claude board
        working-directory: engine/rl_after
        run: |
          export RL_FV="$GITHUB_WORKSPACE/engine/forward_valuation"
          export PYTHONPATH="$GITHUB_WORKSPACE/engine/forward_valuation:$GITHUB_WORKSPACE/engine/rl_after"
          python rl_export.py
      - name: Build authoritative registry
        run: PYTHONPATH=vnext python vnext/active_universe.py --out build/task013-registry
      - name: Generate continuity candidate
        run: |
          PYTHONPATH=vnext python vnext/forward_value_continuity.py \
            --board engine/rl_after/rl_app_data.json \
            --registry build/task013-registry/authoritative_universe.csv \
            --out build/task013
      - name: Verify full-population invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('build/task013/summary.json').read_text())
          assert s['raw_active_players'] == 805
          assert s['authoritative_players'] == 804
          assert s['legacy_only_players'] == 1
          assert s['changed_fields'] == 7
          assert s['changed_authoritative_fields'] == 7
          assert s['changed_legacy_only_fields'] == 0
          assert s['affected_authoritative_players'] == 4
          assert s['remaining_authoritative_exact_zeros'] == 0
          assert s['current_values_changed'] == 0
          assert s['ranks_changed'] == 0
          assert s['non_zero_forward_values_changed'] == 0
          PY
      - name: Run vNext tests
        run: cd vnext && python -m pytest -q
      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: task013-forward-zero-continuity
          path: build/task013
          if-no-files-found: error
