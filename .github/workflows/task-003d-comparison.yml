name: TASK-003D comparison harness

on:
  pull_request:
    branches: [vnext]
    paths:
      - "vnext/comparison_harness.py"
      - "vnext/run_comparison.py"
      - "vnext/test_task003_comparison.py"
      - ".github/workflows/task-003d-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install vNext dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-vnext.txt

      - name: Run comparison harness twice
        run: |
          python vnext/run_comparison.py --out build/task-003d-first
          python vnext/run_comparison.py --out build/task-003d-second

      - name: Verify deterministic baseline outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          first = Path("build/task-003d-first")
          second = Path("build/task-003d-second")
          manifest_first = json.loads((first / "manifest.json").read_text())
          manifest_second = json.loads((second / "manifest.json").read_text())
          assert manifest_first == manifest_second
          assert manifest_first["models"] == ["baseline_recent_scoring"]
          assert manifest_first["expected_rows_per_model"] == 20094
          for name in [
              "baseline_predictions.csv",
              "predictions.csv",
              "metrics_by_lead.csv",
              "metrics_summary.csv",
              "key_validation.json",
          ]:
              assert (first / name).read_bytes() == (second / name).read_bytes(), name
          print(json.dumps(manifest_first, indent=2, sort_keys=True))
          PY

      - name: Upload baseline comparison artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-003d-baseline-comparison
          path: build/task-003d-first
          if-no-files-found: error
          retention-days: 14
